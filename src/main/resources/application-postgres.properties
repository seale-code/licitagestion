spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/licitagestion?currentSchema=licitagestion_private}
spring.datasource.username=${DB_USER:licitagestion}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.flyway.schemas=licitagestion_private
spring.flyway.default-schema=licitagestion_private

