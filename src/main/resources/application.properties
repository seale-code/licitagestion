spring.application.name=licitagestion
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:demo}
server.port=${APP_PORT:8080}
server.address=${APP_HOST:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.flyway.enabled=true
spring.jackson.time-zone=UTC
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
app.zone=${APP_ZONE:America/Lima}
app.storage=${APP_STORAGE:./data/private-documents}
app.require-https=${REQUIRE_HTTPS:false}
app.security.trusted-proxies=${TRUSTED_PROXY_ADDRESSES:}
app.bootstrap.email=${BOOTSTRAP_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}
app.demo-seed=${DEMO_SEED:false}
app.ai.mode=${AI_MODE:extractive}
app.ai.url=${LLM_URL:https://api.openai.com/v1/chat/completions}
app.ai.key=${LLM_API_KEY:}
app.ai.model=${LLM_MODEL:}
app.ai.transfer=${LLM_DOCUMENT_TRANSFER_ENABLED:false}
app.whatsapp.mode=${WHATSAPP_MODE:dry-run}
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-id=${WHATSAPP_PHONE_ID:}
app.whatsapp.version=${WHATSAPP_API_VERSION:}
app.whatsapp.template=${WHATSAPP_TEMPLATE:}
app.whatsapp.language=${WHATSAPP_LANGUAGE:es}

