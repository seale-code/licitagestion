services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: licitagestion
      POSTGRES_USER: licitagestion
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licitagestion -d licitagestion"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/licitagestion?currentSchema=licitagestion_private
      DB_USER: licitagestion
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_STORAGE: /app/data/private-documents
      DEMO_SEED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - private_documents:/app/data/private-documents
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  private_documents:

